name: Publish

on:
  workflow_call:
    inputs:
      release:
        description: 'github release tag to publish'
        type: string
        required: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Add dependencies
        run: |
          echo '{"private":true}' > scripts/release/package.json
          npm install --prefix scripts/release tar-stream@3.1.7

      # https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          unset NPM_TOKEN
          unset NODE_AUTH_TOKEN
          unset NPM_CONFIG_USERCONFIG
          node scripts/release/publish.mjs ${{ inputs.release }}
